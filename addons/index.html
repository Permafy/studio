<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <meta name="google" value="notranslate">
    <meta name="description" content="Configure Permafy editor addons.">
    <title>Permafy Addons</title>
    <link rel="icon" type="image/png" href="/favicon.png">
    <link rel="manifest" href="/manifest.webmanifest">
    <style>
      html, body, #app { width: 100%; height: 100%; margin: 0; }
      body { font-family: "Helvetica Neue", Helvetica, Arial, sans-serif; }
      #splash { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; background: #f5f5f5; color: #00a8d6; }
      #splash[hidden] { display: none; }
      #splash[data-theme="dark"] { background: #333; color: white; }
      #splash::after { content: ""; width: 48px; height: 48px; border: 5px solid currentColor; border-right-color: transparent; border-radius: 50%; animation: spin 1s linear infinite; }
      @keyframes spin { to { transform: rotate(360deg); } }
    </style>
    <script src="/permafy-domain-toggle.js"></script>
  </head>
  <body>
    <div id="splash" aria-hidden="true"></div>
    <div id="app"></div>
    <script>
      (function () {
        var theme = '';
        try {
          var setting = localStorage.getItem('tw:theme');
          if (setting === 'dark' || setting === 'light') theme = setting;
          else if (setting) {
            var parsed = JSON.parse(setting);
            if (parsed.gui === 'dark' || parsed.gui === 'light') theme = parsed.gui;
          }
        } catch (error) {}
        if (!theme) theme = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        document.body.setAttribute('theme', theme);
        document.getElementById('splash').setAttribute('data-theme', theme);
      })();
    </script>
    <script src="/js/vendors~addon-settings~credits~editor~embed~fullscreen~player~playground.js"></script>
    <script src="/js/vendors~editor~embed~fullscreen~player~playground.js"></script>
    <script src="/js/addon-settings~addons~editor~fullscreen~player~playground.js"></script>
    <script src="/js/addon-settings.js"></script>
    <style>
      body[theme="dark"] {
        --ui-primary: #111111;
        --ui-secondary: #1e1e1e;
        --ui-tertiary: #2e2e2e;
        --ui-modal-background: #111111;
        background: #111111;
      }
      body[theme="dark"] #app {
        background: #111111;
      }
    </style>
  </body>
</html>
